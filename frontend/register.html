<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="login">
        <div class="login_box">
            <h1>💰 Personal Finance</h1>
            <p>Create your account.</p>
            <form id="registerForm">
                <div class="username_box">
                    <h2>Username</h2>
                    <input type="text" id="username_input" placeholder="Choose a username">
                </div>
                <div class="email_box">
                    <h2>Email</h2>
                    <input type="text" id="email_input" placeholder="Enter your email">
                </div>
                <div class="password_box">
                    <h2>Password</h2>
                    <input type="text" id="password_input" placeholder="Create a password">
                </div>
                <button class="login_button" type="submit">Create Account</button>
            </form>
        </div>
    </div>
    <script src="register.js"></script>
</body>

</html>
